# brain-io dependencies managed by Conan.

requirements:
  # FFT (PocketFFT — header-only)
  - "pocketfft/0.0.0.cci.20240801"

  # Audio I/O (dr_libs — header-only, WAV/FLAC/MP3)
  - "dr_libs/cci.20230529"

  # Audio playback (optional, BRAINIO_BUILD_PLAYBACK)
  - "miniaudio/0.11.18"
  - "readerwriterqueue/1.0.6"

  # WebSocket UI (optional, BRAINIO_BUILD_UI)
  - "ixwebsocket/11.4.5"

  # Video I/O (BRAINIO_BUILD_VIDEO=ON) — avcpp + ffmpeg (pulled in transitively).
  # Enable with: BRAINIO_BUILD_VIDEO=ON in your cmake configure step.
  - "avcpp/2.7.1"

  # Real-time video display (BRAINIO_BUILD_DISPLAY=ON) — SDL3 windowing + rendering.
  - "sdl/3.4.0"
