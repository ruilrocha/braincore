<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brain-io Control Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; max-width: 720px; margin: 0 auto; }
  h1 { color: #7b68ee; margin-bottom: 8px; font-size: 1.4em; }
  .status { font-size: 0.85em; margin-bottom: 16px; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.connected { background: #4caf50; }
  .dot.disconnected { background: #f44336; }
  .section { background: #16213e; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .section h2 { color: #7b68ee; font-size: 1em; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 6px; }
  .param { display: flex; align-items: center; margin-bottom: 6px; gap: 8px; }
  .param label { flex: 0 0 180px; font-size: 0.85em; }
  .param input[type=range] { flex: 1; accent-color: #7b68ee; }
  .param select { flex: 1; background: #0f3460; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; font-size: 0.85em; }
  .param input[type=number] { flex: 1; background: #0f3460; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; font-size: 0.85em; width: 80px; }
  .param input[type=text] { flex: 1; background: #0f3460; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; font-size: 0.85em; }
  .param .val { flex: 0 0 50px; text-align: right; font-size: 0.8em; color: #aaa; font-variant-numeric: tabular-nums; }
  .conn-settings { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .conn-settings input { background: #16213e; border: 1px solid #333; color: #e0e0e0; padding: 4px 8px; border-radius: 4px; width: 200px; }
  .conn-settings button { background: #7b68ee; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
  .conn-settings button:hover { background: #6a5acd; }

  .transport { display: flex; gap: 8px; margin-bottom: 4px; }
  .btn { border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: opacity 0.15s; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-start { background: #4caf50; color: #fff; }
  .btn-start:hover:not(:disabled) { background: #43a047; }
  .btn-stop { background: #f44336; color: #fff; }
  .btn-stop:hover:not(:disabled) { background: #e53935; }
  .btn-record { background: #333; color: #e0e0e0; border: 2px solid #666; }
  .btn-record.active { background: #c62828; color: #fff; border-color: #c62828; }
  .btn-record:hover:not(:disabled) { border-color: #999; }
  .btn-rebuild { background: #7b68ee; color: #fff; margin-top: 8px; width: 100%; }
  .btn-rebuild:hover { background: #6a5acd; }
</style>
</head>
<body>
<h1>brain-io</h1>
<div class="conn-settings">
  <input type="text" id="wsUrl" value="ws://localhost:7770" placeholder="ws://localhost:7770">
  <button id="connectBtn">Connect</button>
</div>
<div class="status"><span class="dot disconnected" id="dot"></span><span id="statusText">Disconnected</span></div>

<!-- Transport -->
<div class="section">
  <h2>Transport</h2>
  <div class="param">
    <label>Target (empty = infinite)</label>
    <input type="text" id="targetPath" placeholder="e.g. sounds/target.wav">
  </div>
  <div class="transport">
    <button class="btn btn-start" id="startBtn">▶ Start</button>
    <button class="btn btn-stop" id="stopBtn" disabled>■ Stop</button>
    <button class="btn btn-record" id="recordBtn">⏺ Record</button>
  </div>
</div>

<!-- Brain Configuration -->
<div class="section">
  <h2>Brain Configuration</h2>
  <div class="param">
    <label>Block size</label>
    <select id="cfgBlockSize">
      <option value="512">512</option>
      <option value="1024">1024</option>
      <option value="2048">2048</option>
      <option value="4096" selected>4096</option>
      <option value="8192">8192</option>
      <option value="16384">16384</option>
    </select>
  </div>
  <div class="param">
    <label>Window shape</label>
    <select id="cfgWindow">
      <option value="0">Rectangle</option>
      <option value="1">Hamming</option>
      <option value="2">Hann</option>
      <option value="3">Blackman</option>
      <option value="4">Bartlett</option>
      <option value="5">Flat Top</option>
      <option value="6" selected>Gaussian</option>
    </select>
  </div>
  <div class="param">
    <label>Search algorithm</label>
    <select id="cfgSearch">
      <option value="closest" selected>Closest</option>
      <option value="reverse">Reverse</option>
      <option value="synaptic">Synaptic</option>
      <option value="random">Random</option>
      <option value="weighted_random">Weighted Random</option>
      <option value="markov">Markov Chain</option>
      <option value="momentum">Momentum</option>
    </select>
  </div>
  <div class="param" id="synapsesRow" style="display:none">
    <label>Num synapses</label>
    <input type="number" id="cfgSynapses" value="1000" min="10" max="5000" step="10">
  </div>
  <button class="btn btn-rebuild" id="rebuildBtn">🔄 Rebuild Brain</button>
</div>

<!-- Parameter sections -->
<div class="section">
  <h2>Blend &amp; Reconstruction</h2>
  <div class="param"><label>Alpha</label><input type="range" min="0" max="1" step="0.01" data-param="alpha"><span class="val">1.00</span></div>
  <div class="param"><label>Stickyness</label><input type="range" min="0" max="1" step="0.01" data-param="stickyness"><span class="val">0.00</span></div>
</div>

<div class="section">
  <h2>Usage (Novelty &amp; Boredom)</h2>
  <div class="param"><label>Boredom (usage falloff)</label><input type="range" min="0" max="1" step="0.001" data-param="usage_falloff"><span class="val">1.000</span></div>
  <div class="param"><label>Novelty (usage weight)</label><input type="range" min="0" max="1" step="0.01" data-param="usage_weight"><span class="val">0.00</span></div>
</div>

<div class="section">
  <h2>Fingerprint Blend</h2>
  <div class="param"><label>Blend ratio (prim/sec)</label><input type="range" min="0" max="1" step="0.01" data-param="blend_ratio"><span class="val">1.00</span></div>
  <div class="param"><label>N ratio (raw/norm)</label><input type="range" min="0" max="1" step="0.01" data-param="n_ratio"><span class="val">0.00</span></div>
</div>

<div class="section">
  <h2>Momentum</h2>
  <div class="param"><label>Momentum</label><input type="range" min="0" max="1" step="0.01" data-param="momentum"><span class="val">0.00</span></div>
  <div class="param"><label>Momentum decay</label><input type="range" min="0" max="1" step="0.01" data-param="momentum_decay"><span class="val">0.95</span></div>
</div>

<div class="section">
  <h2>Granular</h2>
  <div class="param"><label>Grain size</label><input type="range" min="0.01" max="1" step="0.01" data-param="grain_size"><span class="val">1.00</span></div>
  <div class="param"><label>Grain scatter</label><input type="range" min="0" max="1" step="0.01" data-param="grain_scatter"><span class="val">0.00</span></div>
  <div class="param"><label>Grain density</label><input type="range" min="0.1" max="4" step="0.1" data-param="grain_density"><span class="val">1.0</span></div>
  <div class="param"><label>Size variation</label><input type="range" min="0" max="1" step="0.01" data-param="grain_size_variation"><span class="val">0.00</span></div>
  <div class="param"><label>Amp variation</label><input type="range" min="0" max="1" step="0.01" data-param="grain_amp_variation"><span class="val">0.00</span></div>
  <div class="param"><label>Pitch jitter</label><input type="range" min="0" max="1" step="0.01" data-param="grain_pitch_jitter"><span class="val">0.00</span></div>
  <div class="param"><label>Hop randomness</label><input type="range" min="0" max="1" step="0.01" data-param="grain_hop_randomness"><span class="val">0.00</span></div>
</div>

<div class="section">
  <h2>Spectral Morph</h2>
  <div class="param"><label>Spectral morph</label><input type="range" min="0" max="1" step="0.01" data-param="spectral_morph"><span class="val">0.00</span></div>
</div>

<div class="section">
  <h2>Stutter</h2>
  <div class="param"><label>Stutter chance</label><input type="range" min="0" max="1" step="0.01" data-param="stutter_chance"><span class="val">0.00</span></div>
  <div class="param"><label>Stutter count</label><input type="range" min="2" max="8" step="1" data-param="stutter_count"><span class="val">2</span></div>
</div>

<div class="section">
  <h2>Envelope</h2>
  <div class="param">
    <label>Envelope shape</label>
    <select data-param="envelope_shape">
      <option value="0" selected>None</option>
      <option value="1">Decay</option>
      <option value="2">Swell</option>
      <option value="3">Tremolo</option>
      <option value="4">Pluck</option>
    </select>
  </div>
  <div class="param"><label>Envelope amount</label><input type="range" min="0" max="1" step="0.01" data-param="envelope_amount"><span class="val">0.00</span></div>
</div>

<script>
let ws = null;
const sliders = document.querySelectorAll('input[data-param]');
const selects = document.querySelectorAll('select[data-param]');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const wsUrlInput = document.getElementById('wsUrl');
const connectBtn = document.getElementById('connectBtn');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const recordBtn = document.getElementById('recordBtn');
const rebuildBtn = document.getElementById('rebuildBtn');
const cfgSearch = document.getElementById('cfgSearch');
const synapsesRow = document.getElementById('synapsesRow');
const targetPath = document.getElementById('targetPath');

function getDecimals(step) {
  if (!step || !step.includes('.')) return 0;
  return step.split('.')[1].length;
}

function sendJson(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// Show/hide synapses row based on search algorithm.
cfgSearch.addEventListener('change', () => {
  const v = cfgSearch.value;
  synapsesRow.style.display = (v === 'synaptic' || v === 'markov') ? 'flex' : 'none';
});

// Transport buttons.
startBtn.addEventListener('click', () => {
  const tgt = targetPath.value.trim();
  const msg = {command: 'start'};
  if (tgt) msg.target_path = tgt;
  sendJson(msg);
});
stopBtn.addEventListener('click', () => sendJson({command: 'stop'}));

let isRecording = false;
recordBtn.addEventListener('click', () => {
  isRecording = !isRecording;
  sendJson({command: 'record', enable: isRecording});
  recordBtn.classList.toggle('active', isRecording);
  recordBtn.textContent = isRecording ? '⏹ Stop Rec' : '⏺ Record';
});

// Rebuild button.
rebuildBtn.addEventListener('click', () => {
  sendJson({
    command: 'rebuild',
    block_size: parseInt(document.getElementById('cfgBlockSize').value),
    overlap: 0,
    window_shape: parseInt(document.getElementById('cfgWindow').value),
    search_strategy: cfgSearch.value,
    num_synapses: parseInt(document.getElementById('cfgSynapses').value)
  });
});

// Parameter sliders.
for (const sl of sliders) {
  sl.addEventListener('input', () => {
    const v = parseFloat(sl.value);
    sl.nextElementSibling.textContent = v.toFixed(getDecimals(sl.step));
    sendJson({param: sl.dataset.param, value: v});
  });
}

// Parameter selects (envelope shape).
for (const sel of selects) {
  sel.addEventListener('change', () => {
    sendJson({param: sel.dataset.param, value: parseInt(sel.value)});
  });
}

function syncUi(msg) {
  // Sync parameter sliders & selects.
  if (msg.params) {
    for (const sl of sliders) {
      const name = sl.dataset.param;
      if (name in msg.params) {
        sl.value = msg.params[name];
        const valSpan = sl.nextElementSibling;
        if (valSpan && valSpan.classList.contains('val')) {
          valSpan.textContent = Number(msg.params[name]).toFixed(getDecimals(sl.step));
        }
      }
    }
    for (const sel of selects) {
      const name = sel.dataset.param;
      if (name in msg.params) sel.value = msg.params[name];
    }
  }

  // Sync config controls.
  if (msg.config) {
    const c = msg.config;
    document.getElementById('cfgBlockSize').value = c.block_size;
    document.getElementById('cfgWindow').value = c.window_shape;
    cfgSearch.value = c.search_strategy;
    document.getElementById('cfgSynapses').value = c.num_synapses;
    synapsesRow.style.display = (c.search_strategy === 'synaptic' || c.search_strategy === 'markov') ? 'flex' : 'none';

    // Sync target path.
    if (c.target_path !== undefined) targetPath.value = c.target_path;

    // Transport state.
    startBtn.disabled = !!c.playing;
    stopBtn.disabled = !c.playing;
    isRecording = !!c.recording;
    recordBtn.classList.toggle('active', isRecording);
    recordBtn.textContent = isRecording ? '⏹ Stop Rec' : '⏺ Record';
  }
}

function connect() {
  if (ws) { ws.close(); ws = null; }
  const url = wsUrlInput.value.trim();
  if (!url) return;

  ws = new WebSocket(url);

  ws.onopen = () => {
    dot.className = 'dot connected';
    statusText.textContent = 'Connected to ' + url;
    connectBtn.textContent = 'Reconnect';
  };
  ws.onclose = () => {
    dot.className = 'dot disconnected';
    statusText.textContent = 'Disconnected';
  };
  ws.onerror = () => {
    dot.className = 'dot disconnected';
    statusText.textContent = 'Connection error';
  };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') syncUi(msg);
    } catch (err) { console.error('Parse error:', err); }
  };
}

connectBtn.addEventListener('click', connect);
connect();
</script>
</body>
</html>
